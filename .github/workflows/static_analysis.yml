name: Static Analysis
on: [push, pull_request]
permissions:
  contents: read

jobs:
  static_analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          # staticcheck@latest (2026.2.x) cannot read the export data format
          # produced by Go 1.27+, so pin to the newest Go release it supports.
          go-version: '1.26'
      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang lld libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libwayland-dev libxkbcommon-dev bc libpam-dev xvfb language-pack-en

      - name: Set environment variable LANG
        run: export LANG=en_EN.UTF-8

      - name: Install analysis tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install lucor.dev/lian@latest

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: |
          gofumpt -d -e .
          test -z "$(goimports -e -d . | tee /dev/stderr)"

      - name: Gocyclo
        run: gocyclo -over 30 .

      - name: Staticcheck
        run: staticcheck ./...
